stages:
  prepare:
    cmd: python src/stage_01_prepare.py
    deps:
      - src/stage_01_prepare.py
      - Anime.csv
    outs:
      - processed_data.csv

  split:
    cmd: python src/stage_02_split.py
    deps:
      - src/stage_02_split.py
      - processed_data.csv

  train:
    cmd: python src/stage_03_train.py
    deps:
      - src/stage_03_train.py

  evaluate:
    cmd: python src/stage_04_evaluate.py
    deps:
      - src/stage_04_evaluate.py
    metrics:
      - metrics.json:
          cache: false

  drift_detection:
    cmd: python drift_detection.py
    deps:
      - drift_detection.py
      - processed_data.csv
    outs:
      - drift_status.txt

  drift_report:
    cmd: python stage_05_online_drift.py
    deps:
      - stage_05_online_drift.py
      - processed_data.csv
    outs:
      - drift_report.html

  online_learning:
    cmd: python online_learning.py
    deps:
      - online_learning.py
      - drift_status.txt