stages:
  stage_01_prepare:
    cmd: python src/stage_01_prepare.py --config=config/config.yaml --params=params.yaml
    deps:
      - src/stage_01_prepare.py
      - config/config.yaml
      - Anime.csv
    outs:
      - processed_data.csv

  stage_02_split:
    cmd: python src/stage_02_split.py --config=config/config.yaml --params=params.yaml
    deps:
      - src/stage_02_split.py
      - config/config.yaml
      - params.yaml
      - processed_data.csv
    outs:
      - train.csv
      - val.csv
      - test.csv

  stage_03_train:
    cmd: python src/stage_03_train.py --config=config/config.yaml --params=params.yaml
    deps:
      - src/stage_03_train.py
      - config/config.yaml
      - params.yaml
      - train.csv
      - val.csv
    outs:
      - xgb_model.json

  stage_04_evaluate:
    cmd: python src/stage_04_evaluate.py --config=config/config.yaml
    deps:
      - src/stage_04_evaluate.py
      - config/config.yaml
      - xgb_model.json
      - test.csv
    metrics:
      - metrics.json:
          cache: false